{% csrf_token %}
{% if form.non_field_errors %}<div class="form-errors">{{ form.non_field_errors }}</div>{% endif %}
<div class="form-grid">{% for field in form %}<div class="field {% if field.name == 'description' or field.name == 'notes' %}field-full{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span>*</span>{% endif %}</label>{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{% for error in field.errors %}<p class="error-text">{{ error }}</p>{% endfor %}</div>{% endfor %}</div>
