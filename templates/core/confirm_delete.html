{% extends "base.html" %}
{% block title %}Delete {{ object_type }} — DocxDeadline{% endblock %}
{% block content %}<section class="center-panel"><p class="eyebrow">Permanent action</p><h1>Delete this<br><em>{{ object_type }}?</em></h1><p class="header-copy">You are about to delete “{{ object }}”. This cannot be undone.</p><form method="post" class="inline-actions">{% csrf_token %}<button class="button button-danger" type="submit">Delete permanently</button><a class="button button-secondary" href="{{ cancel_url }}">Keep it</a></form></section>{% endblock %}
